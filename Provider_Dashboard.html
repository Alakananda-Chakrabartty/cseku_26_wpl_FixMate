<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixMate – Provider Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans min-h-screen flex">
  <!-- Vendor Sidebar -->
  <aside class="w-64 bg-slate-900 text-white p-6 space-y-8 hidden md:block flex-shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-teal-500 rounded-lg flex items-center justify-center font-bold text-slate-900">F</div>
      <span class="font-bold tracking-wide text-lg">FixMate Pro</span>
    </div>
    <nav class="space-y-2 text-sm text-slate-400">
      <a href="#" class="block px-4 py-2.5 rounded-xl bg-indigo-600 text-white font-bold">Overview</a>
      <a href="#" class="block px-4 py-2.5 rounded-xl hover:bg-slate-800">Incoming Jobs</a>
      <a href="#" class="block px-4 py-2.5 rounded-xl hover:bg-slate-800">Earnings</a>
    </nav>
  </aside>

  <!-- Dashboard Main Content -->
  <main class="flex-1 p-8 space-y-8">
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-bold text-slate-900">Vendor Portal</h1>
      <span class="bg-teal-100 text-teal-800 text-xs font-bold px-3 py-1.5 rounded-full">● Online & Accepting Jobs</span>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-2xl border-t-4 border-indigo-600 border-x border-b border-slate-200 shadow-sm">
        <span class="text-xs font-semibold text-slate-400 uppercase">Monthly Earnings</span>
        <h3 class="text-3xl font-black text-slate-900 mt-1">$1,240</h3>
      </div>
      <div class="bg-white p-6 rounded-2xl border-t-4 border-teal-500 border-x border-b border-slate-200 shadow-sm">
        <span class="text-xs font-semibold text-slate-400 uppercase">Completed Jobs</span>
        <h3 class="text-3xl font-black text-slate-900 mt-1">28</h3>
      </div>
      <div class="bg-white p-6 rounded-2xl border-t-4 border-amber-500 border-x border-b border-slate-200 shadow-sm">
        <span class="text-xs font-semibold text-slate-400 uppercase">Rating</span>
        <h3 class="text-3xl font-black text-slate-900 mt-1">4.9 ★</h3>
      </div>
    </div>

    <!-- Live Request Alert -->
    <div class="bg-teal-50 border border-teal-200 p-6 rounded-2xl flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <span class="bg-teal-600 text-white text-xs font-bold px-2.5 py-0.5 rounded-full">NEW REQUEST</span>
        <h3 class="font-bold text-slate-900 text-lg mt-1">Emergency Circuit Leak Repair</h3>
        <p class="text-xs text-slate-600">Location: 1.5 miles away • Estimated payout: $60</p>
      </div>
      <div class="flex gap-3 w-full sm:w-auto">
        <button class="flex-1 sm:flex-none px-5 py-2.5 bg-slate-200 text-slate-700 font-bold text-sm rounded-xl">Decline</button>
        <button class="flex-1 sm:flex-none px-5 py-2.5 bg-teal-600 text-white font-bold text-sm rounded-xl shadow-md">Accept Job</button>
      </div>
    </div>
  </main>
</body>
</html>
