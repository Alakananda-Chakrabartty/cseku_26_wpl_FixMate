<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FixMate — Log In or Sign Up</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132038;
    --ink-soft:#233350;
    --paper:#FAF7F0;
    --brass:#B98A2E;
    --brass-light:#E3B25E;
    --slate:#5C6470;
    --line:#E3DECF;
    --error:#B3413A;
    --success:#2F6D4F;
  }
  body{ background:var(--ink); color:var(--ink); font-family:'Inter',sans-serif; }
  .font-display{ font-family:'Fraunces',serif; }
  .font-mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:.08em; }

  .blueprint-bg{
    background-color:var(--ink);
    background-image: radial-gradient(circle at 1px 1px, rgba(227,178,94,0.18) 1px, transparent 0);
    background-size:26px 26px;
  }

  /* Tabs */
  .tab-track{ position:relative; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:4px; }
  .tab-thumb{
    position:absolute; top:4px; bottom:4px; left:4px;
    width:calc(50% - 4px); border-radius:7px;
    background:var(--ink); transition:transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .tab-track[data-active="register"] .tab-thumb{ transform:translateX(100%); }
  .tab-btn{ position:relative; z-index:1; transition:color .3s ease; }
  .tab-btn.is-active{ color:var(--paper); }
  .tab-btn:not(.is-active){ color:var(--slate); }

  /* Form panels */
  .panel{ transition:opacity .25s ease, transform .25s ease; }
  .panel[hidden]{ display:none; }

  .field-input{
    width:100%; font-size:.875rem; background:#fff; border:1px solid var(--line);
    border-radius:.5rem; padding:.65rem .8rem;
  }
  .field-input:focus{ outline:none; box-shadow:0 0 0 2px var(--brass-light); border-color:var(--brass); }

  .eye-btn{ color:var(--slate); transition:color .2s ease; }
  .eye-btn:hover{ color:var(--ink); }

  /* Toast */
  #toast-stack{ position:fixed; top:1rem; right:1rem; z-index:100; display:flex; flex-direction:column; gap:.5rem; }
  .toast{
    min-width:260px; max-width:340px; background:var(--ink); color:var(--paper);
    border-left:4px solid var(--brass); border-radius:.5rem; padding:.85rem 1rem;
    font-size:.8rem; box-shadow:0 14px 30px -10px rgba(0,0,0,0.4);
    display:flex; align-items:flex-start; gap:.6rem;
    transform:translateX(120%); opacity:0;
    animation: toast-in .35s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .toast.toast-error{ border-left-color:var(--error); }
  .toast.toast-success{ border-left-color:var(--success); }
  .toast.toast-out{ animation: toast-out .3s ease forwards; }
  @keyframes toast-in{ to{ transform:translateX(0); opacity:1; } }
  @keyframes toast-out{ to{ transform:translateX(120%); opacity:0; } }

  @media (prefers-reduced-motion: reduce){
    .tab-thumb, .panel, .toast{ transition:none; animation:none; }
  }
</style>
</head>
<body class="antialiased min-h-screen blueprint-bg flex items-center justify-center px-6 py-12">

  <div id="toast-stack" aria-live="polite"></div>

  <div class="w-full max-w-sm bg-[var(--paper)] border border-[var(--line)] rounded-2xl shadow-2xl p-8">
    <a href="/" class="text-xs font-mono uppercase text-[var(--slate)] hover:text-[var(--brass)] transition">&larr; Back home</a>

    <h1 id="page-title" class="font-display text-2xl font-semibold text-[var(--ink)] mt-4 mb-5">Welcome back</h1>

    <!-- Tab toggle -->
    <div class="tab-track flex text-sm font-semibold mb-6" data-active="login" id="tab-track">
      <div class="tab-thumb"></div>
      <button type="button" id="tab-login" class="tab-btn is-active flex-1 py-2 rounded-lg">Log In</button>
      <button type="button" id="tab-register" class="tab-btn flex-1 py-2 rounded-lg">Sign Up</button>
    </div>

    <!-- LOGIN PANEL -->
    <form id="login-form" class="panel space-y-4">
      <div>
        <label class="block text-xs font-semibold text-[var(--slate)] uppercase tracking-wide mb-1">Email</label>
        <input type="email" name="email" required placeholder="you@example.com" class="field-input" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-[var(--slate)] uppercase tracking-wide mb-1">Password</label>
        <div class="relative">
          <input type="password" name="password" required placeholder="••••••••" class="field-input pr-10" data-pw-input />
          <button type="button" class="eye-btn absolute right-2.5 top-1/2 -translate-y-1/2" data-pw-toggle aria-label="Show password">
            <svg data-eye-open class="w-4.5 h-4.5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
            <svg data-eye-closed class="w-4.5 h-4.5 hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M9.9 5.1A11 11 0 0 1 12 5c7 0 11 7 11 7a13.5 13.5 0 0 1-3.1 3.8M6.3 6.9C3.7 8.6 2 11 2 11a13.5 13.5 0 0 0 4.2 4.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="w-full bg-[var(--ink)] text-[var(--paper)] text-sm font-semibold py-3 rounded-lg hover:bg-[var(--ink-soft)] transition">
        Log In
      </button>
    </form>

    <!-- REGISTER PANEL -->
    <form id="register-form" class="panel space-y-4" hidden>
      <div>
        <label class="block text-xs font-semibold text-[var(--slate)] uppercase tracking-wide mb-1">Full Name</label>
        <input type="text" name="fullName" required placeholder="Jane Doe" class="field-input" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-[var(--slate)] uppercase tracking-wide mb-1">Email</label>
        <input type="email" name="email" required placeholder="you@example.com" class="field-input" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-[var(--slate)] uppercase tracking-wide mb-1">Password</label>
        <div class="relative">
          <input type="password" name="password" required minlength="8" placeholder="At least 8 characters" class="field-input pr-10" data-pw-input />
          <button type="button" class="eye-btn absolute right-2.5 top-1/2 -translate-y-1/2" data-pw-toggle aria-label="Show password">
            <svg data-eye-open class="w-4.5 h-4.5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
            <svg data-eye-closed class="w-4.5 h-4.5 hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M9.9 5.1A11 11 0 0 1 12 5c7 0 11 7 11 7a13.5 13.5 0 0 1-3.1 3.8M6.3 6.9C3.7 8.6 2 11 2 11a13.5 13.5 0 0 0 4.2 4.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div>
        <label class="block text-xs font-semibold text-[var(--slate)] uppercase tracking-wide mb-1">I am signing up as</label>
        <select name="role" class="field-input">
          <option value="customer">Customer</option>
          <option value="provider">Service Provider</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-[var(--brass)] text-white text-sm font-semibold py-3 rounded-lg hover:bg-[var(--ink)] transition">
        Create Account
      </button>
    </form>

    <p id="switch-line" class="text-center text-xs text-[var(--slate)] mt-6">
      Don't have an account?
      <button type="button" id="switch-to-register" class="text-[var(--brass)] font-semibold hover:underline">Sign up</button>
    </p>
  </div>

  <script>
    // ---------- Tabs ----------
    const tabTrack = document.getElementById('tab-track');
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const pageTitle = document.getElementById('page-title');
    const switchLine = document.getElementById('switch-line');
    const switchToRegister = document.getElementById('switch-to-register');

    function setTab(tab){
      const isLogin = tab === 'login';
      tabTrack.dataset.active = tab;
      tabLogin.classList.toggle('is-active', isLogin);
      tabRegister.classList.toggle('is-active', !isLogin);
      loginForm.hidden = !isLogin;
      registerForm.hidden = isLogin;
      pageTitle.textContent = isLogin ? 'Welcome back' : 'Create your account';
      switchLine.innerHTML = isLogin
        ? `Don't have an account? <button type="button" id="switch-to-register" class="text-[var(--brass)] font-semibold hover:underline">Sign up</button>`
        : `Already have an account? <button type="button" id="switch-to-login" class="text-[var(--brass)] font-semibold hover:underline">Log in</button>`;
      // rebind the inline switch link since innerHTML was replaced
      const link = document.getElementById(isLogin ? 'switch-to-register' : 'switch-to-login');
      link.addEventListener('click', () => setTab(isLogin ? 'register' : 'login'));
      history.replaceState(null, '', isLogin ? '#login' : '#register');
    }

    tabLogin.addEventListener('click', () => setTab('login'));
    tabRegister.addEventListener('click', () => setTab('register'));
    switchToRegister.addEventListener('click', () => setTab('register'));
    if (window.location.hash === '#register') setTab('register');

    // ---------- Password show/hide ----------
    document.querySelectorAll('[data-pw-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('[data-pw-input]');
        const open = btn.querySelector('[data-eye-open]');
        const closed = btn.querySelector('[data-eye-closed]');
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        open.classList.toggle('hidden', show);
        closed.classList.toggle('hidden', !show);
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });
    });

    // ---------- Toast ----------
    const toastStack = document.getElementById('toast-stack');
    function showToast(message, type = 'success'){
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.innerHTML = `<span>${type === 'success' ? '✓' : '⚠'}</span><span>${message}</span>`;
      toastStack.appendChild(el);
      setTimeout(() => {
        el.classList.add('toast-out');
        el.addEventListener('animationend', () => el.remove());
      }, 3200);
    }

    // ---------- Submit handlers ----------
    async function handleSubmit(e, url, successMessage){
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalLabel = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Please wait…';

      const formData = new FormData(e.target);
      const payload = Object.fromEntries(formData.entries());

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          showToast(successMessage, 'success');
          setTimeout(() => { window.location.href = data.redirect; }, 700);
        } else {
          showToast(data.message || 'Something went wrong.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = originalLabel;
        }
      } catch (err) {
        showToast('Network error. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
      }
    }

    loginForm.addEventListener('submit', (e) => handleSubmit(e, '/login', 'Welcome back!'));
    registerForm.addEventListener('submit', (e) => handleSubmit(e, '/register', 'Account created!'));
  </script>

</body>
</html>
