<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FixMate — Provider Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132038; --ink-soft:#233350; --paper:#FAF7F0; --paper-dim:#F1ECE0;
    --brass:#B98A2E; --brass-light:#E3B25E; --slate:#5C6470; --line:#E3DECF;
    --green-bg:#E4F1E8; --green-text:#2F6D4F;
    --amber-bg:#FBEFD9; --amber-text:#9C6B0E;
    --blue-bg:#E3EAF7; --blue-text:#2F4F8F;
    --red-bg:#F7E7E5; --red-text:#A5392F;
  }
  body{ background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; }
  .font-display{ font-family:'Fraunces',serif; }
  .font-mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:.06em; }

  .stat-card{ background:#fff; border:1px solid var(--line); border-radius:14px; }

  .tab-track{ position:relative; display:inline-flex; background:var(--paper-dim); border:1px solid var(--line); border-radius:10px; padding:4px; }
  .tab-thumb{ position:absolute; top:4px; bottom:4px; left:4px; width:calc(50% - 4px); border-radius:7px; background:var(--ink); transition:transform .35s cubic-bezier(.2,.8,.2,1); }
  .tab-track[data-active="completed"] .tab-thumb{ transform:translateX(100%); }
  .tab-btn{ position:relative; z-index:1; transition:color .3s ease; padding:.55rem 1.25rem; font-weight:600; font-size:.85rem; border-radius:7px; white-space:nowrap; }
  .tab-btn.is-active{ color:var(--paper); }
  .tab-btn:not(.is-active){ color:var(--slate); }

  .badge{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; font-weight:600; padding:3px 10px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; }
  .badge-completed{ background:var(--green-bg); color:var(--green-text); }
  .badge-pending{ background:var(--amber-bg); color:var(--amber-text); }
  .badge-accepted{ background:var(--blue-bg); color:var(--blue-text); }
  .badge-declined{ background:var(--red-bg); color:var(--red-text); }
  .badge-dot{ width:6px; height:6px; border-radius:999px; background:currentColor; }

  .job-card{ background:#fff; border:1px solid var(--line); border-radius:14px; transition:box-shadow .25s ease, transform .25s ease; }
  .job-card:hover{ box-shadow:0 14px 30px -18px rgba(19,32,56,0.3); transform:translateY(-2px); }

  .panel{ animation: fade-in .3s ease; }
  @keyframes fade-in{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:translateY(0);} }

  .star-filled{ color:var(--brass); }
  .star-empty{ color:var(--line); }

  /* Decline modal */
  #modal-overlay{
    position:fixed; inset:0; background:rgba(19,32,56,0.55); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; padding:1.5rem; z-index:100;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  #modal-overlay.is-open{ opacity:1; pointer-events:auto; }
  #modal-card{
    background:var(--paper); border-radius:16px; max-width:26rem; width:100%; padding:1.75rem;
    transform:scale(.94) translateY(8px); transition:transform .25s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 30px 70px -20px rgba(19,32,56,0.5);
  }
  #modal-overlay.is-open #modal-card{ transform:scale(1) translateY(0); }

  /* Toast */
  #toast-stack{ position:fixed; top:1rem; right:1rem; z-index:100; display:flex; flex-direction:column; gap:.5rem; }
  .toast{ min-width:260px; max-width:340px; background:var(--ink); color:var(--paper); border-left:4px solid var(--brass); border-radius:.5rem; padding:.85rem 1rem; font-size:.8rem; box-shadow:0 14px 30px -10px rgba(0,0,0,0.4); display:flex; align-items:flex-start; gap:.6rem; transform:translateX(120%); opacity:0; animation:toast-in .35s cubic-bezier(.2,.8,.2,1) forwards; }
  .toast.toast-error{ border-left-color:var(--red-text); }
  .toast.toast-success{ border-left-color:var(--green-text); }
  .toast.toast-out{ animation:toast-out .3s ease forwards; }
  @keyframes toast-in{ to{ transform:translateX(0); opacity:1; } }
  @keyframes toast-out{ to{ transform:translateX(120%); opacity:0; } }

  @media (prefers-reduced-motion: reduce){
    .tab-thumb, .job-card, .panel, #modal-overlay, #modal-card, .toast{ transition:none; animation:none; }
  }
</style>
</head>
<body class="antialiased">

  <div id="toast-stack" aria-live="polite"></div>

  <header class="sticky top-0 z-40 bg-[var(--paper)]/90 backdrop-blur border-b border-[var(--line)]">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <span class="font-display text-xl font-semibold tracking-tight text-[var(--ink)]">FixMate <span class="font-mono text-[11px] text-[var(--brass)] align-middle">PROVIDER</span></span>
      <nav class="flex items-center gap-4 text-sm font-medium">
        <a href="/" class="text-[var(--slate)] hover:text-[var(--ink)] transition">Home</a>
        <a href="/logout" class="border border-[var(--line)] px-4 py-2 rounded-lg hover:bg-[var(--paper-dim)] transition">Log Out</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-16">

    <div class="mb-8">
      <span class="font-mono text-[11px] text-[var(--brass)] uppercase">Your workspace</span>
      <h1 class="font-display text-2xl md:text-3xl font-semibold text-[var(--ink)] mt-1">Provider Dashboard</h1>
    </div>

    <!-- EARNINGS SUMMARY -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
      <div class="stat-card p-5">
        <p class="font-mono text-[10.5px] text-[var(--slate)] uppercase mb-1.5">Total Earnings</p>
        <p id="stat-earnings" class="font-display text-2xl font-semibold text-[var(--ink)]">৳0</p>
      </div>
      <div class="stat-card p-5">
        <p class="font-mono text-[10.5px] text-[var(--slate)] uppercase mb-1.5">Completed Jobs</p>
        <p id="stat-completed" class="font-display text-2xl font-semibold text-[var(--ink)]">0</p>
      </div>
      <div class="stat-card p-5">
        <p class="font-mono text-[10.5px] text-[var(--slate)] uppercase mb-1.5">Pending Requests</p>
        <p id="stat-pending" class="font-display text-2xl font-semibold text-[var(--ink)]">0</p>
      </div>
      <div class="stat-card p-5">
        <p class="font-mono text-[10.5px] text-[var(--slate)] uppercase mb-1.5">Avg. Rating</p>
        <p id="stat-rating" class="font-display text-2xl font-semibold text-[var(--ink)] flex items-center gap-1">
          4.8 <svg class="w-4 h-4 star-filled -mt-0.5" viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6L1.3 7.2l6.1-.6z"/></svg>
        </p>
      </div>
    </div>

    <div class="flex items-center justify-between flex-wrap gap-4 mb-6">
      <div class="tab-track" data-active="requests" id="tab-track">
        <div class="tab-thumb"></div>
        <button type="button" id="tab-requests" class="tab-btn is-active">Job Requests</button>
        <button type="button" id="tab-completed" class="tab-btn">Completed Jobs</button>
      </div>
    </div>

    <!-- JOB REQUESTS (pending + accepted) -->
    <div id="panel-requests" class="panel space-y-4"></div>

    <!-- COMPLETED JOBS (completed + declined) -->
    <div id="panel-completed" class="panel space-y-4" hidden></div>
  </main>

  <!-- Decline confirmation modal -->
  <div id="modal-overlay">
    <div id="modal-card">
      <div class="w-10 h-10 rounded-full bg-[var(--red-bg)] text-[var(--red-text)] flex items-center justify-center mb-4">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 2.5 17a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2 class="font-display text-xl font-semibold text-[var(--ink)] mb-1">Decline this job request?</h2>
      <p id="modal-job-desc" class="text-sm text-[var(--slate)] mb-6">The customer will be notified that you can't take this job.</p>
      <div class="flex gap-3">
        <button type="button" id="modal-keep" class="flex-1 border border-[var(--line)] text-sm font-semibold py-2.5 rounded-lg hover:bg-[var(--paper-dim)] transition">Never Mind</button>
        <button type="button" id="modal-confirm" class="flex-1 bg-[var(--red-text)] text-white text-sm font-semibold py-2.5 rounded-lg hover:opacity-90 transition">Decline Job</button>
      </div>
    </div>
  </div>

  <script>
    // ---- Mock data (replace with real API data) ----
    let jobs = [
      { id: 1, service: 'AC Servicing',            customer: 'Rana Miah',    date: 'Sep 2, 2026 · 3:00 PM',  amount: 500,  amountLabel: '৳500',  status: 'pending' },
      { id: 2, service: 'Split AC Installation',    customer: 'Tania Ferdous', date: 'Sep 4, 2026 · 11:00 AM', amount: 1500, amountLabel: '৳1,500', status: 'pending' },
      { id: 3, service: 'AC Gas Refill',             customer: 'Kamal Uddin',  date: 'Aug 30, 2026 · 5:00 PM', amount: 700,  amountLabel: '৳700',  status: 'accepted' },
      { id: 4, service: 'AC Servicing',              customer: 'Nusrat Jahan', date: 'Aug 18, 2026 · 2:00 PM', amount: 500,  amountLabel: '৳500',  status: 'completed', rating: 5 },
      { id: 5, service: 'Duct Cleaning',              customer: 'Sabbir Alam',  date: 'Aug 10, 2026 · 9:00 AM', amount: 900,  amountLabel: '৳900',  status: 'completed', rating: 4 },
      { id: 6, service: 'AC Repair',                  customer: 'Farhana Islam', date: 'Aug 3, 2026 · 1:00 PM', amount: 650,  amountLabel: '৳650',  status: 'declined' },
    ];

    const badgeMeta = {
      pending:   { label: 'New Request',        cls: 'badge-pending' },
      accepted:  { label: 'Accepted · Upcoming', cls: 'badge-accepted' },
      completed: { label: 'Completed',           cls: 'badge-completed' },
      declined:  { label: 'Declined',            cls: 'badge-declined' },
    };

    function starsHTML(rating){
      let html = '<div class="flex gap-0.5 mt-1">';
      for (let i = 1; i <= 5; i++){
        html += `<svg class="w-3.5 h-3.5 ${i <= rating ? 'star-filled' : 'star-empty'}" viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6L1.3 7.2l6.1-.6z"/></svg>`;
      }
      html += '</div>';
      return html;
    }

    function actionsHTML(j){
      if (j.status === 'pending'){
        return `
          <div class="flex gap-2 mt-2">
            <button type="button" class="text-xs font-semibold text-white bg-[var(--ink)] px-3 py-1.5 rounded-lg hover:bg-[var(--ink-soft)] transition" data-accept="${j.id}">Accept</button>
            <button type="button" class="text-xs font-semibold text-[var(--red-text)] border border-[var(--red-text)]/30 px-3 py-1.5 rounded-lg hover:bg-[var(--red-bg)] transition" data-decline="${j.id}">Decline</button>
          </div>`;
      }
      if (j.status === 'accepted'){
        return `<button type="button" class="text-xs font-semibold text-[var(--green-text)] border border-[var(--green-text)]/30 px-3 py-1.5 rounded-lg hover:bg-[var(--green-bg)] transition mt-2" data-complete="${j.id}">Mark as Completed</button>`;
      }
      return '';
    }

    function jobCard(j){
      const meta = badgeMeta[j.status];
      const ratingBlock = j.status === 'completed' && j.rating ? starsHTML(j.rating) : '';
      return `
        <div class="job-card p-5 flex items-start justify-between gap-4">
          <div>
            <div class="flex items-center gap-2 mb-1.5 flex-wrap">
              <h3 class="font-display text-base font-semibold text-[var(--ink)]">${j.service}</h3>
              <span class="badge ${meta.cls}"><span class="badge-dot"></span>${meta.label}</span>
            </div>
            <p class="text-xs text-[var(--slate)]">${j.customer} &middot; ${j.date}</p>
            ${ratingBlock}
            ${actionsHTML(j)}
          </div>
          <p class="font-mono text-sm font-semibold text-[var(--ink)] shrink-0">${j.amountLabel}</p>
        </div>`;
    }

    function render(){
      const requests = jobs.filter(j => j.status === 'pending' || j.status === 'accepted');
      const history = jobs.filter(j => j.status === 'completed' || j.status === 'declined');

      const panelRequests = document.getElementById('panel-requests');
      const panelCompleted = document.getElementById('panel-completed');

      panelRequests.innerHTML = requests.length
        ? requests.map(jobCard).join('')
        : `<p class="text-sm text-[var(--slate)] bg-white border border-[var(--line)] rounded-xl p-6 text-center">No job requests right now.</p>`;

      panelCompleted.innerHTML = history.length
        ? history.map(jobCard).join('')
        : `<p class="text-sm text-[var(--slate)] bg-white border border-[var(--line)] rounded-xl p-6 text-center">No completed jobs yet.</p>`;

      document.querySelectorAll('[data-accept]').forEach(btn =>
        btn.addEventListener('click', () => acceptJob(Number(btn.dataset.accept))));
      document.querySelectorAll('[data-decline]').forEach(btn =>
        btn.addEventListener('click', () => openDeclineModal(Number(btn.dataset.decline))));
      document.querySelectorAll('[data-complete]').forEach(btn =>
        btn.addEventListener('click', () => completeJob(Number(btn.dataset.complete))));

      updateStats();
    }

    function updateStats(){
      const completedJobs = jobs.filter(j => j.status === 'completed');
      const totalEarnings = completedJobs.reduce((sum, j) => sum + j.amount, 0);
      const pendingCount = jobs.filter(j => j.status === 'pending').length;

      document.getElementById('stat-earnings').textContent = `৳${totalEarnings.toLocaleString()}`;
      document.getElementById('stat-completed').textContent = completedJobs.length;
      document.getElementById('stat-pending').textContent = pendingCount;
    }

    // ---- Tabs ----
    const tabTrack = document.getElementById('tab-track');
    const tabRequests = document.getElementById('tab-requests');
    const tabCompleted = document.getElementById('tab-completed');
    const panelRequestsEl = document.getElementById('panel-requests');
    const panelCompletedEl = document.getElementById('panel-completed');

    function setTab(tab){
      const isRequests = tab === 'requests';
      tabTrack.dataset.active = tab;
      tabRequests.classList.toggle('is-active', isRequests);
      tabCompleted.classList.toggle('is-active', !isRequests);
      panelRequestsEl.hidden = !isRequests;
      panelCompletedEl.hidden = isRequests;
    }
    tabRequests.addEventListener('click', () => setTab('requests'));
    tabCompleted.addEventListener('click', () => setTab('completed'));

    // ---- Toast ----
    const toastStack = document.getElementById('toast-stack');
    function showToast(message, type = 'success'){
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.innerHTML = `<span>${type === 'success' ? '✓' : '⚠'}</span><span>${message}</span>`;
      toastStack.appendChild(el);
      setTimeout(() => {
        el.classList.add('toast-out');
        el.addEventListener('animationend', () => el.remove());
      }, 3200);
    }

    // ---- Accept / Complete (no modal needed — low risk, reversible via history) ----
    function acceptJob(id){
      jobs = jobs.map(j => j.id === id ? { ...j, status: 'accepted' } : j);
      render();
      showToast('Job accepted — added to your upcoming jobs.', 'success');
    }

    function completeJob(id){
      jobs = jobs.map(j => j.id === id ? { ...j, status: 'completed', rating: null } : j);
      render();
      showToast('Job marked as completed.', 'success');
    }

    // ---- Decline modal ----
    const overlay = document.getElementById('modal-overlay');
    const modalDesc = document.getElementById('modal-job-desc');
    const modalKeep = document.getElementById('modal-keep');
    const modalConfirm = document.getElementById('modal-confirm');
    let pendingDeclineId = null;

    function openDeclineModal(id){
      const j = jobs.find(x => x.id === id);
      if (!j) return;
      pendingDeclineId = id;
      modalDesc.textContent = `${j.service} for ${j.customer} on ${j.date} will be declined and the customer notified.`;
      overlay.classList.add('is-open');
    }
    function closeModal(){
      overlay.classList.remove('is-open');
      pendingDeclineId = null;
    }
    modalKeep.addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

    modalConfirm.addEventListener('click', () => {
      if (pendingDeclineId != null){
        jobs = jobs.map(j => j.id === pendingDeclineId ? { ...j, status: 'declined' } : j);
        render();
        showToast('Job request declined.', 'error');
      }
      closeModal();
    });

    render();
  </script>

</body>
</html>
