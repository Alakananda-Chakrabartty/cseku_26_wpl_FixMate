<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FixMate — Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132038; --ink-soft:#233350; --paper:#FAF7F0; --paper-dim:#F1ECE0;
    --brass:#B98A2E; --brass-light:#E3B25E; --slate:#5C6470; --line:#E3DECF;
    --green-bg:#E4F1E8; --green-text:#2F6D4F;
    --amber-bg:#FBEFD9; --amber-text:#9C6B0E;
    --red-bg:#F7E7E5; --red-text:#A5392F;
  }
  
  body{ background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; }
  .font-display{ font-family:'Fraunces',serif; }
  .font-mono{ font-family:'IBM Plex Mono',monospace; letter-spacing:.06em; }

  .tab-track{ position:relative; display:inline-flex; background:var(--paper-dim); border:1px solid var(--line); border-radius:10px; padding:4px; }
  .tab-thumb{ position:absolute; top:4px; bottom:4px; left:4px; width:calc(50% - 4px); border-radius:7px; background:var(--ink); transition:transform .35s cubic-bezier(.2,.8,.2,1); }
  .tab-track[data-active="history"] .tab-thumb{ transform:translateX(100%); }
  .tab-btn{ position:relative; z-index:1; transition:color .3s ease; padding:.55rem 1.25rem; font-weight:600; font-size:.85rem; border-radius:7px; }
  .tab-btn.is-active{ color:var(--paper); }
  .tab-btn:not(.is-active){ color:var(--slate); }

  .badge{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; font-weight:600; padding:3px 10px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; }
  .badge-completed{ background:var(--green-bg); color:var(--green-text); }
  .badge-pending{ background:var(--amber-bg); color:var(--amber-text); }
  .badge-cancelled{ background:var(--red-bg); color:var(--red-text); }
  .badge-dot{ width:6px; height:6px; border-radius:999px; background:currentColor; }

  .booking-card{ background:#fff; border:1px solid var(--line); border-radius:14px; transition:box-shadow .25s ease, transform .25s ease; }
  .booking-card:hover{ box-shadow:0 14px 30px -18px rgba(19,32,56,0.3); transform:translateY(-2px); }

  .panel{ animation: fade-in .3s ease; }
  @keyframes fade-in{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:translateY(0);} }

  /* Modal */
  #modal-overlay{
    position:fixed; inset:0; background:rgba(19,32,56,0.55); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; padding:1.5rem; z-index:100;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  #modal-overlay.is-open{ opacity:1; pointer-events:auto; }
  #modal-card{
    background:var(--paper); border-radius:16px; max-width:26rem; width:100%; padding:1.75rem;
    transform:scale(.94) translateY(8px); transition:transform .25s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 30px 70px -20px rgba(19,32,56,0.5);
  }
  #modal-overlay.is-open #modal-card{ transform:scale(1) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .tab-thumb, .booking-card, .panel, #modal-overlay, #modal-card{ transition:none; animation:none; }
  }
</style>
</head>

<body class="antialiased">

  <header class="sticky top-0 z-40 bg-[var(--paper)]/90 backdrop-blur border-b border-[var(--line)]">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <span class="font-display text-xl font-semibold tracking-tight text-[var(--ink)]">FixMate</span>
      <nav class="flex items-center gap-4 text-sm font-medium">
        <a href="/directory" class="text-[var(--slate)] hover:text-[var(--ink)] transition">Directory</a>
        <a href="/checkout" class="text-[var(--slate)] hover:text-[var(--ink)] transition">Checkout</a>
        <a href="/admin" id="admin-link" class="text-[var(--brass)] font-semibold hover:underline" hidden>Admin Panel</a>
        <a href="/logout" class="border border-[var(--line)] px-4 py-2 rounded-lg hover:bg-[var(--paper-dim)] transition">Log Out</a>
      </nav>
      
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-16">
    <div class="flex items-center justify-between flex-wrap gap-4 mb-8">
      <div>
        <span class="font-mono text-[11px] text-[var(--brass)] uppercase">Your account</span>
        <h1 class="font-display text-2xl md:text-3xl font-semibold text-[var(--ink)] mt-1">Dashboard</h1>
      </div>

      <div class="tab-track" data-active="active" id="tab-track">
        <div class="tab-thumb"></div>
        <button type="button" id="tab-active" class="tab-btn is-active">Active Bookings</button>
        <button type="button" id="tab-history" class="tab-btn">Booking History</button>
      </div>
    </div>

    <!-- ACTIVE BOOKINGS -->
    <div id="panel-active" class="panel space-y-4"></div>

    <!-- HISTORY -->
    <div id="panel-history" class="panel space-y-4" hidden></div>
  </main>

  <!-- Cancel confirmation modal -->
  <div id="modal-overlay">
    <div id="modal-card">
      <div class="w-10 h-10 rounded-full bg-[var(--red-bg)] text-[var(--red-text)] flex items-center justify-center mb-4">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 2.5 17a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2 class="font-display text-xl font-semibold text-[var(--ink)] mb-1">Cancel this booking?</h2>
      <p id="modal-booking-desc" class="text-sm text-[var(--slate)] mb-6">This will cancel your booking and notify the provider.</p>
      <div class="flex gap-3">
        <button type="button" id="modal-keep" class="flex-1 border border-[var(--line)] text-sm font-semibold py-2.5 rounded-lg hover:bg-[var(--paper-dim)] transition">Keep Booking</button>
        <button type="button" id="modal-confirm" class="flex-1 bg-[var(--red-text)] text-white text-sm font-semibold py-2.5 rounded-lg hover:opacity-90 transition">Cancel Booking</button>
      </div>
    </div>
  </div>

  <script>
    // ---- Mock data (replace with real session/API data) ----
    let bookings = [
      { id: 1, service: 'AC Servicing', provider: 'CoolFix Ltd.', date: 'Sep 2, 2026 · 3:00 PM', amount: '৳500', status: 'pending' },
      { id: 2, service: 'Deep Home Cleaning', provider: 'SparkleCo', date: 'Sep 5, 2026 · 10:00 AM', amount: '৳1,200', status: 'pending' },
      { id: 3, service: 'Electrical Wiring Check', provider: 'VoltPro', date: 'Aug 20, 2026 · 1:00 PM', amount: '৳800', status: 'completed' },
      { id: 4, service: 'Lawn Trimming', provider: 'GreenEdge', date: 'Aug 12, 2026 · 9:00 AM', amount: '৳350', status: 'completed' },
      { id: 5, service: 'Interior Painting (1 room)', provider: 'BrushWorks', date: 'Aug 6, 2026 · 11:00 AM', amount: '৳2,500', status: 'cancelled' },
    ];

    const badgeMeta = {
      pending:   { label: 'Pending',   cls: 'badge-pending' },
      completed: { label: 'Completed', cls: 'badge-completed' },
      cancelled: { label: 'Cancelled', cls: 'badge-cancelled' },
    };

    function bookingCard(b){
      const meta = badgeMeta[b.status];
      const cancelBtn = b.status === 'pending'
        ? `<button type="button" class="text-xs font-semibold text-[var(--red-text)] hover:underline" data-cancel="${b.id}">Cancel Booking</button>`
        : '';
      return `
        <div class="booking-card p-5 flex items-center justify-between gap-4">
          <div>
            <div class="flex items-center gap-2 mb-1.5">
              <h3 class="font-display text-base font-semibold text-[var(--ink)]">${b.service}</h3>
              <span class="badge ${meta.cls}"><span class="badge-dot"></span>${meta.label}</span>
            </div>
            <p class="text-xs text-[var(--slate)]">${b.provider} &middot; ${b.date}</p>
          </div>
          <div class="text-right shrink-0">
            <p class="font-mono text-sm font-semibold text-[var(--ink)] mb-2">${b.amount}</p>
            ${cancelBtn}
          </div>
        </div>`;
    }

    function render(){
      const active = bookings.filter(b => b.status === 'pending');
      const history = bookings.filter(b => b.status !== 'pending');

      const panelActive = document.getElementById('panel-active');
      const panelHistory = document.getElementById('panel-history');

      panelActive.innerHTML = active.length
        ? active.map(bookingCard).join('')
        : `<p class="text-sm text-[var(--slate)] bg-white border border-[var(--line)] rounded-xl p-6 text-center">No active bookings right now.</p>`;

      panelHistory.innerHTML = history.length
        ? history.map(bookingCard).join('')
        : `<p class="text-sm text-[var(--slate)] bg-white border border-[var(--line)] rounded-xl p-6 text-center">No past bookings yet.</p>`;

      document.querySelectorAll('[data-cancel]').forEach(btn => {
        btn.addEventListener('click', () => openModal(Number(btn.dataset.cancel)));
      });
    }

    // ---- Tabs ----
    const tabTrack = document.getElementById('tab-track');
    const tabActive = document.getElementById('tab-active');
    const tabHistory = document.getElementById('tab-history');
    const panelActiveEl = document.getElementById('panel-active');
    const panelHistoryEl = document.getElementById('panel-history');

    function setTab(tab){
      const isActive = tab === 'active';
      tabTrack.dataset.active = tab;
      tabActive.classList.toggle('is-active', isActive);
      tabHistory.classList.toggle('is-active', !isActive);
      panelActiveEl.hidden = !isActive;
      panelHistoryEl.hidden = isActive;
    }
    tabActive.addEventListener('click', () => setTab('active'));
    tabHistory.addEventListener('click', () => setTab('history'));

    // ---- Cancel modal ----
    const overlay = document.getElementById('modal-overlay');
    const modalDesc = document.getElementById('modal-booking-desc');
    const modalKeep = document.getElementById('modal-keep');
    const modalConfirm = document.getElementById('modal-confirm');
    let pendingCancelId = null;

    function openModal(id){
      const b = bookings.find(x => x.id === id);
      if (!b) return;
      pendingCancelId = id;
      modalDesc.textContent = `${b.service} with ${b.provider} on ${b.date} will be cancelled and the provider notified.`;
      overlay.classList.add('is-open');
    }
    function closeModal(){
      overlay.classList.remove('is-open');
      pendingCancelId = null;
    }
    modalKeep.addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

    modalConfirm.addEventListener('click', () => {
      if (pendingCancelId != null){
        bookings = bookings.map(b => b.id === pendingCancelId ? { ...b, status: 'cancelled' } : b);
        render();
      }
      closeModal();
    });

    render();
  </script>
<script>
  fetch('/me')
    .then(res => res.ok ? res.json() : null)
    .then(data => {
      if (data && data.user && data.user.role === 'admin') {
        document.getElementById('admin-link').hidden = false;
      }
    })
    .catch(() => { /* fail silently — link just stays hidden */ });
</script>
</body>
</html>
