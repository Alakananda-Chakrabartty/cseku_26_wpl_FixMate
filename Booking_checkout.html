<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixMate – Service Booking & Checkout</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans min-h-screen">
  <!-- Stepper Header -->
  <header class="bg-white border-b border-slate-200 py-4">
    <div class="max-w-4xl mx-auto px-6 flex items-center justify-between text-xs sm:text-sm font-semibold">
      <div class="flex items-center gap-2 text-slate-400"><span>1. Service Details</span></div>
      <div class="flex items-center gap-2 text-indigo-600 font-bold"><span class="w-6 h-6 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs">2</span><span>Schedule & Address</span></div>
      <div class="flex items-center gap-2 text-slate-400"><span>3. Payment</span></div>
    </div>
  </header>

  <div class="max-w-4xl mx-auto px-6 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
    <!-- Form Steps -->
    <div class="md:col-span-2 space-y-6">
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <h3 class="font-bold text-lg text-slate-900">Select Date & Time</h3>
        <input type="date" class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500">
        <div class="grid grid-cols-3 gap-3">
          <button class="py-2.5 bg-indigo-50 border border-indigo-600 text-indigo-600 rounded-xl font-bold text-xs">10:00 AM</button>
          <button class="py-2.5 bg-slate-50 border border-slate-200 text-slate-600 rounded-xl font-medium text-xs hover:border-indigo-500">02:00 PM</button>
          <button class="py-2.5 bg-slate-50 border border-slate-200 text-slate-600 rounded-xl font-medium text-xs hover:border-indigo-500">04:30 PM</button>
        </div>
      </div>

      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <h3 class="font-bold text-lg text-slate-900">Service Address</h3>
        <textarea rows="3" class="w-full px-4 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500" placeholder="Enter full address details..."></textarea>
      </div>
    </div>

    <!-- Order Summary -->
    <div class="space-y-6">
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 sticky top-6">
        <h3 class="font-bold text-slate-900 border-b border-slate-100 pb-3">Booking Summary</h3>
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-slate-200 rounded-xl flex items-center justify-center text-xs font-bold text-slate-400">Photo</div>
          <div>
            <h4 class="font-bold text-slate-900 text-sm">Rahim Uddin</h4>
            <p class="text-xs text-slate-500">Electrical Inspection</p>
          </div>
        </div>
        <div class="space-y-2 text-xs text-slate-600 border-t border-b border-slate-100 py-3">
          <div class="flex justify-between"><span>Base Hourly Rate</span><span>$45.00</span></div>
          <div class="flex justify-between"><span>Service Fee</span><span>$5.00</span></div>
          <div class="flex justify-between font-bold text-slate-900 text-sm pt-2"><span>Total</span><span class="text-emerald-600">$50.00</span></div>
        </div>
        <button class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition-all text-sm">Confirm & Pay</button>
      </div>
    </div>
  </div>
</body>
</html>
